name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check out the target PR
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr checkout ${{ inputs.pr_number }}

      - uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read .claude/CLAUDE.md and .claude/agents/code-reviewer.md, then review
            this pull request exactly as that agent defines.

            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number || inputs.pr_number }}

            First inspect the complete PR using `gh pr diff`.

            Follow the complete review process defined in code-reviewer.md.
            In particular:
            - review the entire PR before reporting findings
            - do not stop after finding the first few issues
            - perform a second pass looking for issues that may have been missed
            - inspect relevant files outside the diff when needed to understand
              framework patterns, related tests, fixtures, helpers, or conventions
            - do not blindly scan the entire repository
            - return one consolidated review containing all significant findings

            Always post exactly one top-level summary with `gh pr comment`, even
            if you find nothing worth flagging - say so explicitly rather than
            staying silent, so a passing review is visible, not indistinguishable
            from a run that failed to post anything.

            For a finding tied to a specific line, additionally use
            `mcp__github_inline_comment__create_inline_comment` (confirmed: true).

            Post comments only - do not edit any files.

          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"