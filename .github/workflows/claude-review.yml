name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check out the target PR
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr checkout ${{ inputs.pr_number }}

      - uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read .claude/CLAUDE.md and .claude/agents/code-reviewer.md, then review
            this pull request exactly as that agent defines: same focus areas, same
            severity levels, same output format (Severity / Location / Problem /
            Why it matters / Recommendation).

            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number || inputs.pr_number }}

            Base the review on `gh pr diff`. Read other files only when the diff
            itself requires it to judge a change correctly - do not scan the repo.

            Always post exactly one top-level summary with `gh pr comment`, even
            if you find nothing worth flagging - say so explicitly rather than
            staying silent, so a passing review is visible, not indistinguishable
            from a run that failed to post anything. For a finding tied to a
            specific line, additionally use
            `mcp__github_inline_comment__create_inline_comment` (confirmed: true).
            Post comments only - do not edit any files.
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
