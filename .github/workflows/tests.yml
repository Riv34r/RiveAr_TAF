name: Tests

# Boots the RiveAr App SUT from source, then runs TAF's suites against it.
# Called by smoke.yml and regression.yml - they share the one boot, which
# costs minutes while the tests cost seconds.

on:
  workflow_call:
    inputs:
      run_label:
        description: Shown in the job summary and artifact name.
        required: true
        type: string
      api_args:
        description: Extra pytest flags for the API suite - flags only, no paths.
        required: false
        type: string
        default: ""

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Reject suite paths in api_args
        run: |
          case "${{ inputs.api_args }}" in
            *tests/*) echo "::error::api_args takes flags only" >&2; exit 1 ;;
          esac

      - name: Check out TAF
        uses: actions/checkout@v6

      - name: Check out RiveAr App (SUT)
        uses: actions/checkout@v6
        with:
          repository: Riv34r/RiveAr
          path: sut

      - name: Configure the SUT for a local Docker Compose run
        working-directory: sut
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env

      - name: Boot Postgres + backend
        working-directory: sut
        # Only what the suites need - the frontend is never started.
        run: docker compose up -d --build --wait postgres backend

      - name: Apply database migrations
        working-directory: sut
        run: docker compose exec -T backend alembic upgrade head

      - name: Seed the database
        run: |
          curl -sf --max-time 30 -X POST http://localhost:8000/api/v1/test/reset \
            -H "Content-Type: application/json" -d '{"profile": "standard"}'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TAF
        run: pip install -e .

      - name: Configure TAF
        run: cp .env.example .env

      # continue-on-error so one red suite doesn't hide the other's result -
      # the gate step at the end turns that back into a job failure.
      - name: API tests
        id: api
        continue-on-error: true
        run: |
          set -o pipefail
          pytest tests/api ${{ inputs.api_args }} --junitxml=reports/junit-api.xml | tee pytest-api.txt

      - name: DB tests
        id: db
        continue-on-error: true
        run: |
          set -o pipefail
          pytest tests/db --junitxml=reports/junit-db.xml | tee pytest-db.txt

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## ${{ inputs.run_label }}"
            for suite in api db; do
              echo "### $suite"
              echo '```'
              tail -n 20 "pytest-$suite.txt" 2>/dev/null || echo "did not run"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.run_label }}-reports
          path: reports/
          retention-days: 14

      # Only fires on a boot failure - continue-on-error swallows test failures.
      - name: Show SUT logs
        if: failure()
        working-directory: sut
        run: docker compose logs postgres backend

      - name: Fail if either suite failed
        if: always()
        run: |
          [ "${{ steps.api.outcome }}" = success ] && [ "${{ steps.db.outcome }}" = success ]
