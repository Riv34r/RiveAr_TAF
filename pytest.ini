[pytest]
# Pytest configuration for the RiveAr Test Automation Framework
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: Quick smoke tests
addopts = --alluredir=reports/allure_results --junitxml=reports/junit.xml -ra
# Every request is logged with its X-Request-ID. pytest replays these for
# failing tests and writes the full run to the log file below - no custom
# logging setup needed.
log_level = INFO
log_file = reports/logs/test_run.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
